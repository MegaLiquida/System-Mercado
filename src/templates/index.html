<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado Gestão - Controle de Estoque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .nav-tabs .nav-link { color: #495057; font-weight: 500; }
        .nav-tabs .nav-link.active { color: #0d6efd; border-bottom: 3px solid #0d6efd; }
        .card { border: none; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); }
        .table-container { background: white; border-radius: 8px; padding: 20px; }
        .status-entrada { color: #198754; font-weight: bold; }
        .status-saida { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1"><i class="bi bi-shop"></i> Mercado Gestão</span>
            <div class="d-flex align-items-center">
                <span class="text-white me-3">Olá, {{ session.usuario_nome }}</span>
                <a href="/logout" class="btn btn-outline-light btn-sm">Sair</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <ul class="nav nav-tabs mb-4" id="mercadoTabs" role="tablist">
            <li class="nav-item">
                <button class="nav-link active" id="estoque-tab" data-bs-toggle="tab" data-bs-target="#estoque" type="button">Estoque</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="cadastro-tab" data-bs-toggle="tab" data-bs-target="#cadastro" type="button">Cadastro de Produtos</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="movimentacoes-tab" data-bs-toggle="tab" data-bs-target="#movimentacoes" type="button">Movimentações Hoje</button>
            </li>
        </ul>

        <div class="tab-content" id="mercadoTabsContent">
            <!-- ABA ESTOQUE -->
            <div class="tab-pane fade show active" id="estoque" role="tabpanel">
                <div class="row mb-4">
                    <div class="col-md-6">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" id="searchEAN" class="form-control" placeholder="Pesquisar por EAN...">
                        </div>
                    </div>
                </div>
                <div class="table-container">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>EAN</th>
                                <th>Descrição</th>
                                <th>Preço</th>
                                <th>Validade</th>
                                <th>Qtd Atual</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="listaEstoque">
                            <!-- Preenchido via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- ABA CADASTRO -->
            <div class="tab-pane fade" id="cadastro" role="tabpanel">
                <div class="card p-4 mx-auto" style="max-width: 600px;">
                    <h4 class="mb-4">Novo Produto / Atualizar</h4>
                    <form id="formCadastro">
                        <div class="mb-3">
                            <label class="form-label">EAN (Código de Barras)</label>
                            <input type="text" class="form-control" id="cadEAN" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descrição do Produto</label>
                            <input type="text" class="form-control" id="cadDescricao" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Preço (R$)</label>
                                <input type="number" step="0.01" class="form-control" id="cadPreco" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Data de Validade</label>
                                <input type="date" class="form-control" id="cadValidade">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Quantidade Inicial</label>
                            <input type="number" class="form-control" id="cadQtd" value="0">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Salvar Produto</button>
                    </form>
                </div>
            </div>

            <!-- ABA MOVIMENTAÇÕES -->
            <div class="tab-pane fade" id="movimentacoes" role="tabpanel">
                <div class="table-container">
                    <h5 class="mb-3">Histórico de Hoje</h5>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Hora</th>
                                <th>Produto</th>
                                <th>Tipo</th>
                                <th>Qtd</th>
                                <th>Usuário</th>
                            </tr>
                        </thead>
                        <tbody id="listaMovimentacoes">
                            <!-- Preenchido via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Movimentação -->
    <div class="modal fade" id="modalMovimentar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Movimentar Estoque</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p id="modalProdInfo" class="fw-bold"></p>
                    <div class="mb-3">
                        <label class="form-label">Quantidade</label>
                        <input type="number" class="form-control" id="movQtd" min="1" value="1">
                    </div>
                    <input type="hidden" id="movEAN">
                    <input type="hidden" id="movTipo">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnConfirmarMov">Confirmar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const modalMov = new bootstrap.Modal(document.getElementById('modalMovimentar'));

        async function carregarEstoque() {
            const res = await fetch('/api/produtos');
            const produtos = await res.json();
            const tbody = document.getElementById('listaEstoque');
            tbody.innerHTML = '';
            
            produtos.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td>${p.ean}</td>
                        <td>${p.descricao}</td>
                        <td>R$ ${p.preco.toFixed(2)}</td>
                        <td>${p.validade || '-'}</td>
                        <td><span class="badge bg-secondary">${p.quantidade}</span></td>
                        <td>
                            <button class="btn btn-sm btn-success" onclick="abrirMov('${p.ean}', '${p.descricao}', 'ENTRADA')"><i class="bi bi-plus"></i></button>
                            <button class="btn btn-sm btn-danger" onclick="abrirMov('${p.ean}', '${p.descricao}', 'SAIDA')"><i class="bi bi-dash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        async function carregarMovimentacoes() {
            const res = await fetch('/api/movimentacoes/hoje');
            const movs = await res.json();
            const tbody = document.getElementById('listaMovimentacoes');
            tbody.innerHTML = '';
            
            movs.forEach(m => {
                tbody.innerHTML += `
                    <tr>
                        <td>${m.data_movimentacao}</td>
                        <td>${m.descricao} <br><small class="text-muted">${m.ean}</small></td>
                        <td><span class="status-${m.tipo.toLowerCase()}">${m.tipo}</span></td>
                        <td>${m.quantidade}</td>
                        <td>${m.usuario_nome}</td>
                    </tr>
                `;
            });
        }

        function abrirMov(ean, desc, tipo) {
            document.getElementById('modalTitle').innerText = tipo === 'ENTRADA' ? 'Entrada de Estoque' : 'Saída de Estoque';
            document.getElementById('modalProdInfo').innerText = desc;
            document.getElementById('movEAN').value = ean;
            document.getElementById('movTipo').value = tipo;
            document.getElementById('movQtd').value = 1;
            modalMov.show();
        }

        document.getElementById('btnConfirmarMov').onclick = async () => {
            const data = {
                ean: document.getElementById('movEAN').value,
                tipo: document.getElementById('movTipo').value,
                quantidade: document.getElementById('movQtd').value
            };
            
            const res = await fetch('/api/movimentar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            
            const result = await res.json();
            if(result.success) {
                modalMov.hide();
                carregarEstoque();
                carregarMovimentacoes();
            } else {
                alert(result.message);
            }
        };

        document.getElementById('formCadastro').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                ean: document.getElementById('cadEAN').value,
                descricao: document.getElementById('cadDescricao').value,
                preco: document.getElementById('cadPreco').value,
                validade: document.getElementById('cadValidade').value,
                quantidade: document.getElementById('cadQtd').value
            };
            
            const res = await fetch('/api/produtos/cadastrar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            
            const result = await res.json();
            if(result.success) {
                alert("Produto salvo com sucesso!");
                document.getElementById('formCadastro').reset();
                carregarEstoque();
            } else {
                alert(result.message);
            }
        };

        document.getElementById('searchEAN').oninput = function() {
            const term = this.value.toLowerCase();
            const rows = document.querySelectorAll('#listaEstoque tr');
            rows.forEach(row => {
                const ean = row.cells[0].innerText.toLowerCase();
                row.style.display = ean.includes(term) ? '' : 'none';
            });
        };

        // Carregar dados iniciais
        carregarEstoque();
        carregarMovimentacoes();
        
        // Atualizar movimentações ao trocar de aba
        document.getElementById('movimentacoes-tab').onclick = carregarMovimentacoes;
    </script>
</body>
</html>
